id: VANILLA-OVERWORLD
type: BIOME
abstract: true

ocean:
  palette: BLOCK:minecraft:blue_stained_glass
  level: 62

terrain:
  sampler: $biomes/vanilla/abstract/terrain/density-functions/final_density.yml:sampler

  samplertest:
    dimensions: 3
    type: EXPRESSION
    expression: yClampedGradient(y, 256, 62, -1, 1) + base_3d_noise(x, y, z)
    functions:
      yClampedGradient:
        arguments:
          - x
          - x0
          - x1
          - y0
          - y1
        expression: min(max((x - x0) / (x1 - x0), 0), 1) * (y1 - y0) + y0
    samplers:
      base_3d_noise: $biomes/vanilla/abstract/terrain/density-functions/base_3d_noise.yml:sampler
