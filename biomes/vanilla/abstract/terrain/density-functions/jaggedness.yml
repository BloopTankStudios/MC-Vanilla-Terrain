            if(erosion_f < -0.375,
            spline0(erosion_f, -0.5775, spline_1(ridges_f, erosion_f, continents_f, ridges_folded_f), -0.375, 0),
            0))))
          functions:
            spline: $math/functions/spline.yml:functions.spline
            spline0: $math/functions/spline.yml:functions.spline0
            spline_0:
              arguments: *id001
              expression: |-
                if(ridges_folded_f < 0.19999999,
                0,
                if(ridges_folded_f < 0.44999996,
                spline0(ridges_folded_f, 0.19999999, 0, 0.44999996, 0),
                if(ridges_folded_f < 1,
                spline0(ridges_folded_f, 0.44999996, 0, 1, spline_0(ridges_f, erosion_f, continents_f, ridges_folded_f)),
                spline_0(ridges_f, erosion_f, continents_f, ridges_folded_f))))
              functions:
                spline: $math/functions/spline.yml:functions.spline
                spline0: $math/functions/spline.yml:functions.spline0
                spline_0:
                  arguments: *id001
                  expression: |-
                    if(ridges_f < -0.01,
                    0.63,
                    if(ridges_f < 0.01,
                    spline0(ridges_f, -0.01, 0.63, 0.01, 0.3),
                    0.3))
                  functions:
                    spline: $math/functions/spline.yml:functions.spline
                    spline0: $math/functions/spline.yml:functions.spline0
                    spline_left_end: $math/functions/spline.yml:functions.spline_left_end
                    spline_right_end: $math/functions/spline.yml:functions.spline_right_end
                spline_left_end: $math/functions/spline.yml:functions.spline_left_end
                spline_right_end: $math/functions/spline.yml:functions.spline_right_end
            spline_1:
