sampler:
  dimensions: 2
  expression: spline_func(ridges(x, z), erosion(x, z), continents(x, z), ridges_folded(x,
    z))
  functions:
    spline_func:
      arguments: &id001
      - ridges_f
      - erosion_f
      - continents_f
      - ridges_folded_f
      expression: |-
        if(continents_f < -0.11,
        0,
        if(continents_f < 0.03,
        spline0(continents_f, -0.11, 0, 0.03, spline_0(ridges_f, erosion_f, continents_f, ridges_folded_f)),
        if(continents_f < 0.65,
        spline0(continents_f, 0.03, spline_0(ridges_f, erosion_f, continents_f, ridges_folded_f), 0.65, spline_1(ridges_f, erosion_f, continents_f, ridges_folded_f)),
        spline_1(ridges_f, erosion_f, continents_f, ridges_folded_f))))
      functions:
        spline: $math/functions/spline.yml:functions.spline
        spline0: $math/functions/spline.yml:functions.spline0
        spline_0:
          arguments: *id001
          expression: |-
            if(erosion_f < -1,
            spline_0(ridges_f, erosion_f, continents_f, ridges_folded_f),
            if(erosion_f < -0.78,
            spline0(erosion_f, -1, spline_0(ridges_f, erosion_f, continents_f, ridges_folded_f), -0.78, spline_1(ridges_f, erosion_f, continents_f, ridges_folded_f)),
