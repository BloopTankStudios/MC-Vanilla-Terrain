sampler:
  dimensions: 3
  type: EXPRESSION
  expression: |-
    clamp(-1, 1, 
      max(
        weird_spaghetti_2d(x, z) +
        0.083 * spaghetti_2d_thickness_modulator(x, z),
        (abs(8 * spaghetti_2d_elevation(x, z) +
          yClampedGradient(y, -64, 320, 8, -40)) +
          spaghetti_2d_thickness_modulator(x, z)
        ) ^ 3
      )
    )
  functions:
    clamp:
      arguments:
      - minNum
      - maxNum
      - input
      expression: min(maxNum, max(minNum, input))
    yClampedGradient:
      arguments:
        - y
        - fromY
        - toY
        - fromValue
        - toValue
      expression: min(max((y - fromY) / (toY - fromY), 0), 1) * (toValue - fromValue) + fromValue
  samplers:
    spaghetti_2d_thickness_modulator: $biomes/vanilla/abstract/terrain/density-functions/caves/spaghetti_2d_thickness_modulator.yml:sampler
    weird_spaghetti_2d:
      dimensions: 2
      type: EXPRESSION
      expression: |-
        rarity(spaghetti_2d_modulator(x*2, z*2)) *
          abs(spaghetti_2d(x / rarity(spaghetti_2d_modulator(x*2, z*2)),
          z / rarity(spaghetti_2d_modulator(x*2, z*2))))
      functions:
        rarity:
          arguments:
          - input
          expression: if(input < -0.75, 0.5, if(input < -0.5, 0.75, if(input < 0.5, 1, if(input < 0.75, 2, 3))))