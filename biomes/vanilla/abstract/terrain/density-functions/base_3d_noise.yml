
# Should be using "Legacy Random" for exact 1:1, instead will use Terra's Simplex_2 for now
# Based on Blended Noise: https://github.com/misode/deepslate/blob/main/src/math/noise/BlendedNoise.ts
# Using Legacy Random: https://github.com/misode/deepslate/blob/main/src/math/random/LegacyRandom.ts

variables: &variables
  xzScale: 0.25
  yScale: 0.125
  xzFactor: 80
  yFactor: 160
  smearScaleMultiplier: 8


sampler:
  dimensions: 3
  type: EXPRESSION
  expression: 0
  variables: *variables
  samplers:
    main_noise:
      dimensions: 3
      type: EXPRESSION
      expression: 
      samplers:
        dimensions: 3
        type: EXPRESSION
        expression: sample(x * (684.412 * xzScale) / xzFactor, y * (684.412 * yScale) / yFactor, z * (684.412 * xzScale) / xzFactor)
        variables: *variables
        samplers:
          sample:
            type: OPEN_SIMPLEX_2
            frequency: 1